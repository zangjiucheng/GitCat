name: Release

# Tag-push (v1.2.3) builds every platform/arch below and uploads the bundles
# to a (draft) GitHub Release matching the tag. workflow_dispatch runs the
# exact same matrix WITHOUT touching Releases at all — a manual "does the
# whole matrix still build" smoke test, e.g. after bumping a dependency,
# without needing to cut a real tag first.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# tauri-action creates/updates the GitHub Release and uploads assets to it —
# needs write access to Contents (releases are part of the Contents API).
permissions:
  contents: write

jobs:
  # Create the ONE draft release up front, before any platform builds — this
  # is the fix for the duplicate-draft bug. Previously every matrix leg ran
  # tauri-action with `tagName` + `releaseDraft: true`, so each leg
  # independently "find-or-create"d the release. GitHub's get-release-by-tag
  # API does not return drafts, so concurrent legs couldn't see the
  # in-progress draft and each created its OWN — leaving 2+ draft releases for
  # a single tag with the platform assets (and a partial latest.json apiece)
  # scattered across them. Creating the draft exactly once here, and having
  # every build leg upload into it BY ID, removes the race entirely.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Find-or-create the draft release for this tag
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            // listReleases (authenticated, with contents:write) DOES include
            // drafts — unlike the get-by-tag endpoint tauri-action relied on —
            // so a re-run reuses the existing draft instead of stacking a new
            // one on top. Idempotent by design.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            let release = releases.find(r => r.tag_name === tag)
            if (release) {
              core.info(`Reusing existing release ${release.id} for ${tag}`)
            } else {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `GitCat ${tag}`,
                body: "See the assets below for your platform's installer.",
                draft: true,
                prerelease: false,
              })
              release = data
              core.info(`Created draft release ${release.id} for ${tag}`)
            }
            return release.id

  build:
    name: ${{ matrix.name }}
    needs: create-release
    # Run after create-release on a tag push; also run on workflow_dispatch,
    # where create-release is skipped (its result is 'skipped', not 'failure').
    # The !cancelled() status function is what lets this job run despite a
    # skipped dependency; skip only if create-release genuinely FAILED — then
    # there's no release to upload into.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    # Empty for every non-Linux leg, which is how Actions is told "no container".
    # The Linux legs set it to pin the glibc the bundle links against — see the
    # matrix comment below.
    container: ${{ matrix.container }}
    env:
      # linuxdeploy and appimagetool are themselves AppImages, and they mount
      # themselves with FUSE to run. A container has no /dev/fuse, so without
      # this they abort and take the AppImage bundle with them. Harmless on the
      # macOS and Windows legs, which never see an AppImage.
      APPIMAGE_EXTRACT_AND_RUN: 1
    strategy:
      # One slow/flaky platform (e.g. a transient arm64 runner hiccup)
      # shouldn't cancel the other 5 — every platform reports its own real
      # pass/fail instead of a misleading blanket cancellation.
      fail-fast: false
      matrix:
        include:
          # macOS: build NATIVELY on both an Apple Silicon and an Intel
          # runner rather than cross-compiling a universal binary from one
          # host — this is Tauri's own documented reference pattern (avoids
          # any chance of subtle cross-toolchain quirks in git2's vendored
          # libgit2 C build) and produces two normal per-arch bundles instead
          # of one fat universal one, matching "matrix build" literally.
          - name: macOS (Apple Silicon / arm64)
            runner: macos-latest # GitHub's macos-latest is Apple Silicon (arm64) as of this writing
            target: aarch64-apple-darwin
          - name: macOS (Intel / x86_64)
            runner: macos-15-intel # the current Intel-hosted macOS image label (Intel runners are versioned separately from the Apple Silicon "macos-latest" line now)
            target: x86_64-apple-darwin

          # Linux: the GLIBC FLOOR IS THE POINT, and it now lives in a
          # container rather than in the runner label.
          #
          # A release binary linked against a newer glibc than the oldest distro
          # we mean to support raises the minimum OS every user needs, which is
          # the opposite of what a release build wants. That is why this used to
          # pin `ubuntu-22.04`. Measured on the published v1.5.0 bundles, both
          # arches require at most **glibc 2.34** — below jammy's own 2.35.
          #
          #   glibc 2.34  RHEL/Rocky/Alma 9
          #   glibc 2.35  Ubuntu 22.04 LTS
          #   glibc 2.36  Debian 12 bookworm — the CURRENT Debian stable
          #   glibc 2.39  Ubuntu 24.04 LTS   (what noble would link against)
          #
          # So simply bumping the label to 24.04 would have cut off current
          # Debian stable, among others. But the `ubuntu-22.04` images are
          # themselves being retired (deprecation from 2026-09-17, unsupported
          # by 2027-04-17, with brownouts before that), so staying was not an
          # option either.
          #
          # Hence: a SUPPORTED runner supplying the hardware and the Actions
          # plumbing, and a `ubuntu:22.04` CONTAINER supplying the userspace the
          # binary links against. The floor is now a line in this file that
          # someone has to choose to change, instead of a side effect of which
          # images GitHub still offers. When 24.04 retires in turn, only
          # `runner:` moves and the floor does not.
          #
          # `-arm` is a native arm64 runner, and `ubuntu:22.04` is multi-arch,
          # so each leg gets its own architecture with no cross-sysroot.
          - name: Linux (x86_64)
            runner: ubuntu-24.04
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64-unknown-linux-gnu

          # Windows: both native now — GitHub added a hosted native arm64
          # Windows runner (windows-11-arm), so this avoids cross-compiling
          # (MSVC's arm64 cross-linker + a rustup cross target) entirely,
          # same reasoning as preferring native Linux/macOS arm64 runners above.
          - name: Windows (x86_64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows (arm64)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      # The container is a bare `ubuntu:22.04`, not a runner image: it ships
      # none of the things every later step and action assumes are present.
      # This has to come BEFORE checkout, which needs git.
      #
      # `sudo` is installed rather than stripped from the steps below. We are
      # root here and do not need it, but the Linux dependency steps are shared
      # with nothing and read better matching the shape they have always had —
      # and a missing `sudo` fails them in a way that reads like a permission
      # problem rather than a missing package.
      #
      # `build-essential` and `pkg-config` are the ones easy to forget: the
      # hosted images have a compiler already, so the dependency list below
      # never needed to name one, and git2's vendored libgit2 plus every
      # *-sys crate here will not build without them.
      - name: Bootstrap the build container
        if: matrix.container != ''
        # Deliberately NOT `shell: bash`, unlike the steps below. This is the
        # step that runs before anything is installed, so it should assume as
        # little about the image as possible — it is POSIX sh on purpose, and
        # must stay that way. Everything after it may rely on bash.
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ca-certificates curl wget gnupg git \
            build-essential pkg-config file xz-utils \
            desktop-file-utils zsync
          # actions/checkout refuses to work in a directory it does not trust,
          # and inside a container the workspace is owned by a different uid
          # than the root we run as.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7

      # Same rationale as ci.yml's rust job: tauri-runtime-wry links against
      # WebKitGTK/GTK/GLib at BUILD time on Linux, regardless of target arch —
      # see that file's longer comment for the full story. git2 itself needs
      # nothing extra here (vendored libgit2, ssh/https features disabled).
      - name: Install Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            squashfs-tools

      # WebKitGTK 2.46 shipped an upstream regression that aborts a Tauri app at
      # launch with "Could not create default EGL display: EGL_BAD_PARAMETER"
      # (and the WEBKIT_DISABLE_* env-var workarounds only trade the crash for a
      # black content area — the regression also breaks the software path). The
      # Tauri AppImage BUNDLES whatever libwebkit2gtk the build runner has, so a
      # runner that pulled 2.46+ from jammy-updates ships a launch-crashing
      # AppImage even though it compiled fine. Same class of fix GitButler shipped
      # (gitbutlerapp/gitbutler#5301). jammy's apt archive has since jumped 2.36.0
      # (release) -> 2.50.x (updates), so the last pre-regression 2.44.x is no
      # longer installable via apt (and a 2.36 downgrade breaks dependencies).
      # We install the co-versioned 2.44.3 .deb set atomically. The debs come from
      # THIS repo's "build-deps-webkit-2.44.3" prerelease (mirrored from Launchpad)
      # because GitHub Actions runners can't reach launchpad.net (connection times
      # out) — the Azure apt mirror only carries current versions. 2.44.3 is the
      # last 2.44.x published for jammy, on both amd64 and arm64. Revert (and
      # delete that prerelease) once 22.04 ships a fixed WebKitGTK.
      - name: Pin WebKitGTK to 2.44.3 (avoid 2.46+ EGL_BAD_PARAMETER launch crash)
        if: runner.os == 'Linux'
        # `shell: bash` is REQUIRED, not stylistic. A hosted runner defaults
        # `run:` to bash, but inside a container Actions falls back to `sh`,
        # because it cannot assume the image has bash. This script's
        # `set -euxo pipefail` is a bashism and died on the first line with
        # "Illegal option -o pipefail" the first time this ran in a container.
        shell: bash
        run: |
          set -euxo pipefail
          WV=2.44.3-0ubuntu0.22.04.1
          case "${{ matrix.target }}" in
            aarch64-*) DEBARCH=arm64 ;;
            *)         DEBARCH=amd64 ;;
          esac
          BASE=https://github.com/${{ github.repository }}/releases/download/build-deps-webkit-2.44.3
          workdir="$(mktemp -d)"; cd "$workdir"
          # Full co-versioned set — the -dev packages pin "= runtime version", so a
          # partial downgrade would leave apt with held broken packages.
          for p in libjavascriptcoregtk-4.1-0 gir1.2-javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
                   libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev; do
            curl -fsSL --retry 3 -o "${p}.deb" "$BASE/${p}_${WV}_${DEBARCH}.deb"
          done
          sudo apt-get update
          # Installing local .debs lets apt satisfy their (>=) system-lib deps from
          # the archive while downgrading only webkit/jsc to 2.44.3.
          sudo apt-get install -y --allow-downgrades ./*.deb
          sudo apt-mark hold \
            libjavascriptcoregtk-4.1-0 gir1.2-javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev
          echo "== installed WebKitGTK =="
          dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0
          # Fail loudly if the pin did not take, rather than bundling a broken 2.46+.
          test "$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)" = "$WV"

      # NODE FIRST, then pnpm — the reverse of the order everywhere else, and of
      # pnpm's own documented recipe. That recipe works on a hosted runner only
      # because Node is preinstalled there: `pnpm/action-setup` installs pnpm by
      # shelling out to `npm ci`, so in a bare container it dies with
      # "Error: spawn npm ENOENT" before anything else runs. (Its `standalone`
      # input does NOT avoid this — it only swaps the package being installed
      # for `@pnpm/exe`; the install still goes through npm.)
      #
      # The reason the old order existed was `cache: pnpm` on setup-node, which
      # shells out to `pnpm store path` and so needed pnpm first. That is a real
      # constraint and it is why this cannot simply be swapped: the store cache
      # moves to pnpm/action-setup's own `cache` input, which is the same cache
      # keyed on the same lockfile, just owned by the step that knows where the
      # store is.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install Rust stable toolchain (with this matrix entry's target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed per-target (not just per-OS) so the six matrix entries never
      # share or clobber each other's incompatible target-triple artifacts —
      # matters most for the two Windows entries, which share a runner OS.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Manual smoke-test path (workflow_dispatch): build only, never touch
      # Releases. Confirms the whole matrix still compiles after a dependency
      # bump etc. without needing a throwaway tag.
      - name: Build (no release)
        if: github.event_name == 'workflow_dispatch'
        # The updater pubkey in tauri.conf.json makes `tauri build` require the
        # signing key even for a build-only run; supply it like the real release
        # path (tauri-action) below, so the manual smoke-test build actually
        # completes + signs the same artifacts a release would.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      # The manual path's own repack, so a workflow_dispatch build hands over a
      # bundle you can actually install.
      #
      # WHY HERE and not in fix-linux-appimage: that job repairs an asset that is
      # already uploaded to a draft release, because on the tag path tauri-action
      # builds AND uploads in one step and that is the only seam there is. A
      # manual run has no release, so it has the opposite situation — the bundle
      # is sitting on disk and the seam is right here, before the guard looks at
      # it and before it is uploaded as an artifact.
      #
      # Until now nothing repaired the manual path at all: the guard below is
      # fatal and the repack job is tag-only, so every dispatch run reddened its
      # x86_64 leg on linuxdeploy's 0770 AppRun.wrapped and the artifact was a
      # bundle that would not start under firejail or extract-and-run — which is
      # exactly what that path exists to let you test.
      #
      # Self-disabling, like the tag path's: each image is checked first and left
      # byte-identical if it is already correct, so the day linuxdeploy ships a
      # 0755 AppRun this stops repacking and re-signing for nothing.
      #
      # Re-signing matters even here. `tauri build` has already signed the
      # pre-repack bytes, so leaving that .sig next to a repacked AppImage would
      # ship an artifact whose signature silently does not match it.
      - name: Repack the AppImage (manual build only)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        # fix-appimage-perms.sh and the guard are both bash; a container's
        # default shell is sh.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          imgs=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          if [ ${#imgs[@]} -eq 0 ]; then echo "no AppImage built for this target"; exit 0; fi
          for img in "${imgs[@]}"; do
            echo "== $img"
            if scripts/check-appimage-perms.sh "$img"; then
              echo "   already world-executable — left untouched, not re-signed"
              continue
            fi
            scripts/fix-appimage-perms.sh "$img"
            scripts/check-appimage-perms.sh "$img"
            rm -f "$img.sig"
            npx --yes @tauri-apps/cli@2 signer sign "$img"
            [ -s "$img.sig" ] || { echo "signer produced no .sig for $img" >&2; exit 1; }
          done

      # v1.3.2's x86_64 AppImage shipped AppRun.wrapped as 0770, so the app
      # could not start wherever the running user did not own the file — under
      # firejail, under APPIMAGE_EXTRACT_AND_RUN, under AppImageLauncher. It was
      # found by the AppImage catalog's own test, not by us, after it had been
      # released. The aarch64 AppImage of the same tag was 0755, so this is not
      # something this repo configures: it is whichever AppRun that arch's
      # linuxdeploy embeds, which is exactly why it needs a standing check
      # rather than a one-time fix.
      #
      # Runs AFTER the build on purpose. It cannot stop a broken AppImage being
      # built, but it turns the leg red, and the release is a draft nobody has
      # published yet — which is the window this is meant to catch.
      #
      # Reads the modes stored in the squashfs (needs squashfs-tools, installed
      # above) and never an extracted tree: `--appimage-extract` creates every
      # directory it writes at 0700, so walking its output reported ~150
      # directories broken on a clean image. See check-appimage-perms.sh.
      - name: Check the AppImage is world-executable
        if: runner.os == 'Linux'
        # Same reason as the WebKitGTK step: `shopt` and `imgs=(...)` are
        # bashisms, and a container's default shell is `sh`.
        shell: bash
        run: |
          shopt -s nullglob
          imgs=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          if [ ${#imgs[@]} -eq 0 ]; then echo "no AppImage built for this target"; exit 0; fi
          scripts/check-appimage-perms.sh "${imgs[@]}"

      # Make a manual (workflow_dispatch) build downloadable so the bundles can be
      # SMOKE-INSTALLED per-platform (launch + drive the app, watch for CSP/EGL
      # issues) WITHOUT cutting a release tag. This is the pre-1.0 verification
      # path: it does not touch Releases.
      # `always()`, so a red guard never withholds the bundle. The repack step
      # above now handles the one defect we know about, so this is no longer
      # load-bearing for the 0770 case — but it is still the right gate: if the
      # guard ever fails for something the repack does NOT cover, the artifact is
      # the evidence, and skipping the upload would throw it away. The leg still
      # goes red, which is the correct signal; it just hands the bundle over
      # first.
      - name: Upload bundles (manual build only)
        if: always() && github.event_name == 'workflow_dispatch'
        # v7, not v5: v5 runs on node20, which the runner now force-upgrades to
        # node24 with a deprecation warning. Every input used here (name, path,
        # if-no-files-found, retention-days) is unchanged in v7.
        uses: actions/upload-artifact@v7
        with:
          name: gitcat-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: ignore
          retention-days: 7

      # Real release path (tag push): build AND upload every platform's
      # bundle into the ONE shared draft the create-release job made above,
      # addressed by id so no leg ever creates its own. Draft (not
      # published) on purpose — review the generated notes/assets and hit
      # "Publish" by hand once all 6 matrix entries have reported in. The
      # in-app updater (src/islands/updater) only sees a release once it's
      # published AND marked "latest" (not a pre-release) — its endpoint is
      # GitHub's stable `releases/latest/download/latest.json` URL, which
      # only resolves to a published, non-prerelease release. Publishing
      # this draft is therefore also what turns the update live for users.
      #
      # NOTE: this is TWO DIFFERENT KINDS OF "signing", not to be conflated:
      #   - Updater signing (TAURI_SIGNING_PRIVATE_KEY* below) — a minisign
      #     keypair (see tauri.conf.json's plugins.updater.pubkey) proving an
      #     update payload came from this pipeline and wasn't tampered with
      #     in transit. This alone is what's configured here.
      #   - OS-level code signing (Apple Developer ID / notarization, Windows
      #     Authenticode) — proving the BINARY's publisher identity to the
      #     OS. Still NOT configured (no such certificate secrets exist in
      #     this repo) — macOS Gatekeeper and Windows SmartScreen will both
      #     still warn on first launch of a fresh install. That's a separate
      #     follow-up; it does not block the updater from working for an
      #     already-installed app checking for its next update.
      - name: Build + publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the draft create-release already made, by id. With
          # releaseId set, tauri-action uploads this platform's bundle (and
          # merges its entry into the release's shared latest.json) into THAT
          # release instead of trying to create one — which is what used to
          # spawn duplicate drafts. No tagName/releaseName/releaseDraft here
          # on purpose: those are the create-mode inputs we're avoiding.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      # v1.3.2's x86_64 AppImage shipped AppRun.wrapped as 0770, so the app
      # could not start wherever the running user did not own the file — under
      # firejail, under APPIMAGE_EXTRACT_AND_RUN, under AppImageLauncher. It was
      # found by the AppImage catalog's own test, not by us, after it had been
      # released. The aarch64 AppImage of the same tag was 0755, so this is not
      # something this repo configures: it is whichever AppRun that arch's
      # linuxdeploy embeds, which is exactly why it needs a standing check
      # rather than a one-time fix.
      #
      # Runs AFTER the build on purpose. It cannot stop a broken AppImage being
      # built, but it turns the leg red, and the release is a draft nobody has
      # published yet — which is the window this is meant to catch.
      # NOT fatal for x86_64: the fix-linux-appimage job below repacks and
      # re-signs that one, and it `needs: build` — so failing here would skip
      # the very job that repairs what was just detected. That is exactly what
      # happened on the first v1.4.0 run: the guard caught AppRun.wrapped at
      # 0770, reddened this leg, and took the repack and finalize jobs down
      # with it.
      #
      # aarch64 still fails hard. Which is precisely why
      # the guard must not cry wolf: on v1.5.0 it walked an `--appimage-extract`
      # tree, read the extractor's own 0700 directories as the image's, and
      # failed a leg whose AppImage was in fact clean (137 directories at 0755,
      # both AppRun files 0755, measured from the squashfs). That took the
      # repack and finalize jobs down with it and stopped the release — the
      # x86_64 bug of the v1.4.0 run, reached through the other arch. The guard
      # now reads stored modes, so a red aarch64 leg means a real defect.
      #
      # The asymmetry is gone: fix-linux-appimage now repacks BOTH arches from
      # one x86_64 runner, so aarch64 could be continue-on-error here too. It
      # deliberately is not, until a release has actually exercised the aarch64
      # repack path — right now that arch has never needed one, so making its
      # guard non-fatal would retire the only signal that it started to.
      - name: Check the AppImage is world-executable
        if: runner.os == 'Linux'
        continue-on-error: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        # Same reason as the WebKitGTK step: `shopt` and `imgs=(...)` are
        # bashisms, and a container's default shell is `sh`.
        shell: bash
        run: |
          shopt -s nullglob
          imgs=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          if [ ${#imgs[@]} -eq 0 ]; then echo "no AppImage built for this target"; exit 0; fi
          scripts/check-appimage-perms.sh "${imgs[@]}"

  # ---------------------------------------------------------------------------
  # Repack the Linux AppImages so they are world-executable, then RE-SIGN them.
  #
  # v1.3.2 shipped AppRun.wrapped as 0770. AppRun is a shell script linuxdeploy
  # generates whose last line is `exec "$this_dir"/AppRun.wrapped`, so with no
  # `other` execute bit the app cannot start wherever the running user does not
  # own the file — under firejail (which is how the AppImage catalog found it),
  # under APPIMAGE_EXTRACT_AND_RUN where there is no FUSE, under AppImageLauncher.
  # Reproduced directly: that binary at 0770 is NOT executable to a process which
  # is neither its owner nor in its group, and at 0755 it is.
  #
  # BOTH ARCHES, on this one x86_64 runner. This job used to be x86_64-only for
  # a reason that no longer holds: fix-appimage-perms.sh unpacked with
  # `--appimage-extract`, which runs the image's own ELF runtime, so an aarch64
  # AppImage genuinely could not be touched here. It now uses `unsquashfs`,
  # which reads the filesystem without executing anything in it. Rehearsed
  # against the real v1.5.0 x86_64 asset from an arm64 machine: 370 entries in,
  # 370 out, runtime bytes identical, AppRun.wrapped 0770 -> 0755.
  #
  # Which also retires the asymmetry that stopped v1.5.0: the aarch64 leg's
  # guard was fatal because nothing downstream repaired what it found. Now
  # something does.
  #
  # Self-disabling per arch: each asset is checked first and left completely
  # alone if it is already correct, so the day linuxdeploy ships a 0755 AppRun
  # this stops churning assets instead of re-signing them for no reason.
  # Verified: the clean v1.5.0 aarch64 asset comes back byte-identical.
  #
  # WHY HERE and not in the build leg: tauri-action builds AND uploads in one
  # step, so the only seam is after the asset is already in the draft. The draft
  # is not published until a human does it, which is what makes rewriting an
  # asset here safe in a way that rewriting a published one would not be.
  #
  # Re-signing is the part to be careful with. A repacked AppImage matches
  # neither the minisign .sig generated over the original bytes nor its
  # latest.json entry, and that is the Linux updater's chain of trust: an
  # updater whose download fails its signature check refuses the update. So this
  # verifies its own new signature against the public key in tauri.conf.json
  # BEFORE replacing anything, and re-checks what actually landed afterwards.
  fix-linux-appimage:
    name: Repack + re-sign the Linux AppImages
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # unsquashfs to read and unpack (arch-neutrally), mksquashfs to repack,
      # minisign to check our own work the same way a user's updater will.
      - name: Install repack + verify tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools minisign

      - name: Repack, re-sign, verify, replace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_dir="$GITHUB_WORKSPACE"
          work="$(mktemp -d)"
          cd "$work"

          # asset-name suffix -> the latest.json platform key whose entry (and
          # whose URL-sharing aliases) records that asset's signature.
          declare -A KEYS=(
            ["_amd64.AppImage"]="linux-x86_64-appimage"
            ["_aarch64.AppImage"]="linux-aarch64-appimage"
          )

          repacked=()   # "<asset name>|<platform key>" for each one we rewrote
          found=0

          gh release view "$TAG" --repo "$REPO" --json assets > assets.json

          for suffix in "${!KEYS[@]}"; do
            key="${KEYS[$suffix]}"
            # endswith + --arg, NOT a regex. jq string literals reject `\.` as an
            # invalid escape, so building a pattern with sed needs a DOUBLE
            # backslash — and getting that wrong does not fail loudly: jq errors,
            # the capture comes back empty, and the loop reports "no such
            # AppImage, nothing to do" for every arch. The repack would then
            # silently do nothing and the release would ship broken again.
            # Suffix matching needs no escaping at all, so there is nothing to
            # get wrong.
            name="$(jq -r --arg s "$suffix" '.assets[].name | select(endswith($s))' assets.json | head -1)"
            if [ -z "$name" ]; then
              echo "== $suffix: this release has no such AppImage — nothing to do"
              continue
            fi
            found=$((found + 1))
            echo "== $name  (latest.json key: $key)"
            rm -f "$name" "$name.sig"
            gh release download "$TAG" --repo "$REPO" -p "$name" -p "$name.sig" -D .

            if "$repo_dir/scripts/check-appimage-perms.sh" "$name"; then
              echo "   already world-executable — left untouched, not re-signed"
              continue
            fi

            "$repo_dir/scripts/fix-appimage-perms.sh" "$name"
            "$repo_dir/scripts/check-appimage-perms.sh" "$name"

            # Sign the NEW bytes. minisign's trusted comment records the file
            # name, so keeping the name identical keeps that record true.
            rm -f "$name.sig"
            npx --yes @tauri-apps/cli@2 signer sign "$name"
            [ -s "$name.sig" ] || { echo "signer produced no .sig" >&2; exit 1; }

            # Prove the signature before anything downstream depends on it.
            # This is the same check the updater makes on a user's machine.
            python3 "$repo_dir/scripts/minisign-materialize.py" \
              "$name.sig" "$repo_dir/src-tauri/tauri.conf.json" "$name.minisig" tauri.pub
            minisign -V -p tauri.pub -x "$name.minisig" -m "$name"

            gh release upload "$TAG" "$name" "$name.sig" --repo "$REPO" --clobber
            repacked+=("$name|$key")
          done

          # Finding NOTHING is not a quiet success. Every tag build produces both
          # Linux AppImages, so zero matches means the selector broke, which is
          # exactly the failure the endswith change above exists to prevent —
          # and the one shape of it that looks identical to "all clean".
          if [ "$found" -eq 0 ]; then
            echo "no Linux AppImage matched any known suffix — the selector is wrong" >&2
            jq -r '.assets[].name' assets.json | sed 's/^/  /' >&2
            exit 1
          fi

          if [ "${#repacked[@]}" -eq 0 ]; then
            echo "no AppImage needed repacking ($found checked) — latest.json untouched"
            exit 0
          fi

          # latest.json records the signature too, for every entry pointing at
          # each repacked asset — the bare `linux-<arch>` alias as well as
          # `linux-<arch>-appimage`, but NOT the deb and rpm entries, which are
          # different files with their own signatures. Downloaded once and
          # uploaded once, so two arches cannot race each other's edit.
          gh release download "$TAG" --repo "$REPO" -p latest.json -D . --clobber
          for entry in "${repacked[@]}"; do
            name="${entry%%|*}"
            key="${entry##*|}"
            python3 "$repo_dir/scripts/latest-json-set-linux-sig.py" \
              latest.json "$name.sig" "$key"
          done
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          # Re-read what is on the release now, rather than trusting what we
          # think we uploaded, and check it the way a user's machine would.
          for entry in "${repacked[@]}"; do
            name="${entry%%|*}"
            rm -f "$name" "$name.sig" "$name.final.minisig"
            gh release download "$TAG" --repo "$REPO" -p "$name" -p "$name.sig" -D .
            "$repo_dir/scripts/check-appimage-perms.sh" "$name"
            python3 "$repo_dir/scripts/minisign-materialize.py" \
              "$name.sig" "$repo_dir/src-tauri/tauri.conf.json" "$name.final.minisig" tauri.pub
            minisign -V -p tauri.pub -x "$name.final.minisig" -m "$name"
            echo "published $name is world-executable and its signature verifies"
          done

  # Runs ONCE after every matrix leg has uploaded its assets (not per-leg —
  # all 6 platforms share one release) to finish two things tauri-action
  # doesn't reliably handle on its own:
  finalize-release:
    name: Finalize release (prerelease flag + changelog notes)
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The release is now created by the create-release job with
      # prerelease:false, so the flag is reliable at the source. Historically
      # it was tauri-action that created the release, and its own
      # `prerelease: false` input did NOT reliably stick — every release
      # through v0.5.0 ended up prerelease=true on GitHub regardless, which
      # silently breaks the in-app updater: its endpoint
      # (releases/latest/download/latest.json) only ever resolves to a
      # published, NON-prerelease release. Keep force-correcting the flag here
      # anyway as a cheap belt-and-suspenders. The release stays a draft
      # (untouched by this step) for a human to review and publish by hand;
      # this only makes sure that once published, it's discoverable as an update.
      - name: gh release edit --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease=false --repo ${{ github.repository }}

      # create-release seeds the draft body with one fixed, generic
      # sentence — fine as a placeholder, useless as an actual changelog.
      # Replace the draft's description with GitHub's own auto-generated
      # release notes (commits/PRs since the previous tag, same content
      # `gh release create --generate-notes` would produce — `gh release
      # edit` itself has no such flag, so the generate-notes API is called
      # directly) every time this workflow finishes, so the draft is always
      # ready to publish as-is without a human hand-writing notes first.
      - name: Regenerate the draft's release notes from commits since the last tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > changelog.md
          {
            cat changelog.md
            echo
            echo "---"
            echo
            echo "See the assets below for your platform's installer."
          } > notes.md
          gh release edit "${{ github.ref_name }}" --notes-file notes.md --repo ${{ github.repository }}
