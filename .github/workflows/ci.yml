name: CI

on:
  # Only main gets its own push trigger — a feature branch with an open PR
  # already gets CI from `pull_request` below, so triggering `push` for every
  # branch double-runs the whole suite (once per event) on every commit to an
  # open PR. Restricting push to main is the standard fix: main itself is
  # never a PR head here, so it can't double-fire the other way either.
  #
  # Docs-only changes are handled entirely by docs.yml (VitePress build + Pages
  # deploy) and cannot affect the Rust core or the Svelte app, so skip this whole
  # suite when EVERY changed file is under docs/. `paths-ignore` skips a run only
  # when ALL changed files match, so a mixed code+docs commit still runs full CI.
  # (package.json / pnpm-lock.yaml are NOT under docs/, so a real dependency
  # change still triggers both this suite and docs.yml, as it should.)
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit the GITHUB_TOKEN to the least privilege this suite actually needs.
# Without an explicit block the token defaults to broad, mostly-write scopes
# (CodeQL flags this as actions/missing-workflow-permissions). Every job here
# only builds and tests: `actions/checkout` needs `contents: read`, and nothing
# writes back to the repo. The e2e job's `upload-artifact` uses the Actions
# runtime token, not GITHUB_TOKEN scopes, and `$GITHUB_STEP_SUMMARY` is a plain
# env-file write, so neither needs anything beyond read. Declared at workflow
# level so it applies to all four jobs (rust, rust-windows, frontend, e2e).
permissions:
  contents: read

jobs:
  # Builds/tests the Rust core (src-tauri, crate `gitcat_lib`).
  # Independent of the `frontend` job below so the two run in parallel.
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri itself (not just git2) needs system dev libraries on Linux: the
      # tauri-runtime-wry backend links against WebKitGTK/GTK/GLib at BUILD time
      # via gtk-sys/glib-sys/webkit2gtk-sys — this is required for `cargo build`
      # to even compile the `gitcat` binary, regardless of whether the app is
      # ever launched headlessly. (This was missing before and broke CI with
      # "The system library `glib-2.0` ... was not found" — glib-sys is a
      # transitive dep of gtk-sys/webkit2gtk-sys, neither of which are present
      # on a stock ubuntu-latest image.) Matches Tauri v2's documented Linux
      # prerequisites for Debian/Ubuntu.
      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry/index and src-tauri/target, keyed on Cargo.lock.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # NOTE on native deps for git2/libgit2:
      # src-tauri/Cargo.toml pins `git2 = { version = "0.20", default-features = false }`.
      # git2's default features are ["ssh", "https"], which pull in libssh2-sys/openssl-sys
      # respectively — disabling them (as this repo does) means libgit2-sys builds with
      # NEITHER of those, so there is nothing for the runner to have OpenSSL/libssh2
      # dev headers for in the first place.
      # libgit2-sys's build.rs first tries to find a matching system libgit2 (>=1.9.4,
      # <1.10.0) via pkg-config; if that's not found (the normal case on a stock
      # `ubuntu-latest` image, which doesn't ship libgit2-dev) it falls back to compiling
      # the *vendored* libgit2 C sources bundled in the crate itself using the `cc` crate
      # directly (NOT the external `cmake` binary — libgit2-sys does not depend on
      # `cmake`). That vendored path only needs a C compiler and the `pkg-config` binary
      # (for the initial probe attempt), both of which `ubuntu-latest` ships preinstalled
      # (build-essential, pkg-config). This was verified locally against this repo's exact
      # Cargo.lock: the build takes the vendored path (`cargo:rustc-cfg=libgit2_vendored`)
      # with no extra system packages installed beyond the runner's stock image.
      # => No `apt-get install` step is needed here.

      # tauri-build validates bundle.resources at COMPILE time, and
      # tauri.linux.conf.json bundles resources/pdfium/libpdfium.so (#37). The
      # lib is fetched, not committed — pull it before any cargo build/test.
      # Node is preinstalled on GitHub runners; working-directory is src-tauri.
      - name: Fetch PDFium native library
        run: node ../scripts/fetch-pdfium.mjs

      - name: Build
        run: cargo build --locked

      - name: Install git-filter-repo (prep for the M5c filter-repo wizard's test suite; a no-op until that suite lands)
        run: |
          pipx install git-filter-repo
          git filter-repo --version

      - name: Test
        run: cargo test

      # tests/perf_graph.rs already ran once as part of the plain `cargo
      # test` above (Cargo auto-discovers every tests/*.rs file) — this
      # SEPARATE, redundant re-run exists purely for VISIBILITY: its own
      # named step in the Actions UI, and --nocapture so the actual timing
      # numbers land in the log even on success (skimmable over time to
      # notice a repo creeping slower well before it trips the — deliberately
      # generous — failure threshold). See perf_graph.rs's own doc comment
      # for why this exists at all: a WSL-specific version of this exact bug
      # class (a working-tree status scan stalling 185+ SECONDS on a repo
      # with a Linux symlink, reached over the \\wsl.localhost\ bridge —
      # see src/wsl.rs) shipped and went unnoticed until a real large repo
      # surfaced it manually; this is the general, CI-reliable, non-WSL
      # layer of protection against that whole bug CLASS recurring.
      # --test-threads=1 so the three tests' own eprintln! timing lines
      # print in a stable, non-interleaved order.
      #
      # The numbers themselves used to only be visible by opening this
      # step's raw log — easy to forget to check on a green run. Each test's
      # own `eprintln!("[perf] <name>: <elapsed> ...")` line is parsed out and
      # written as a markdown table to $GITHUB_STEP_SUMMARY instead, which
      # GitHub renders directly on the workflow run's summary page (no step
      # expansion needed). `set +e` around the pipe keeps the default
      # `bash -eo pipefail` from aborting the script before the summary gets
      # written on a FAILING run too — ${PIPESTATUS[0]} still captures cargo
      # test's real exit code, and the final `exit` still fails the job/step
      # exactly as before. Deliberately NOT `... | tee perf-output.log ||
      # true`: with pipefail active, running ANY command (even bare `true`)
      # after the pipe resets $PIPESTATUS to reflect THAT command instead —
      # verified locally that this silently turned every failure into a
      # falsely-reported status 0, which would have made this step always
      # "succeed" even on a real regression.
      #
      # `grep -o '\[perf\].*'` (not a line-anchored `^\[perf\]`) because
      # cargo test's own unbuffered "test <name> ... " progress text shares
      # the SAME line as each test's eprintln! (no newline between them until
      # "ok"/"FAILED" is appended) — verified against a real local run; a
      # `^`-anchored match found nothing since "[perf]" is never actually
      # first on its line.
      - name: Performance regression tests
        run: |
          set +e
          cargo test --test perf_graph -- --nocapture --test-threads=1 2>&1 | tee perf-output.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### ⏱️ Performance regression tests"
            echo
            echo "| Check | Elapsed |"
            echo "| --- | --- |"
            grep -o '\[perf\].*' perf-output.log | while IFS= read -r line; do
              body=${line#"[perf] "}
              name=${body%%:*}
              rest=${body#*": "}
              echo "| \`$name\` | $rest |"
            done
            if [ "$status" -ne 0 ]; then
              echo
              echo "⚠️ A performance check **failed** — see this step's log for the exact assertion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build examples
        run: cargo build --examples --locked

  # Builds the Rust core on Windows. Its reason to exist: the `rust` job above
  # only compiles Linux, so any `#[cfg(target_os = "windows")]` code path (e.g.
  # cli_shim::windows_install, plus windows.rs / procutil.rs / wsl.rs) is
  # otherwise unverified until a tagged release runs the 6-platform matrix. This
  # catches a Windows-only compile break on the PR instead.
  #
  # Compile-only, on purpose:
  #  - `cargo build` covers the app/library binary.
  #  - `cargo test --lib --no-run` additionally COMPILES the library unit-test
  #    code on Windows (Windows-clean: the handful of Unix-only cases are
  #    #[cfg(unix)]-guarded), catching a Windows test-compile break too. `--lib`
  #    skips the tests/ integration suite (submodule / repo_registry /
  #    repo_files), which uses unguarded std::os::unix APIs and doesn't compile
  #    on Windows yet (a separate follow-up).
  #  - We deliberately do NOT run the tests. The Tauri library's test binary
  #    transitively links the WebView2/wry native stack and fails to resolve a
  #    DLL entry point at startup on a stock runner (exit 0xc0000139,
  #    STATUS_ENTRYPOINT_NOT_FOUND) before any test executes. The cli_shim
  #    launcher tests are platform-agnostic pure functions already run by the
  #    Linux `rust` job, so running them here would add nothing regardless.
  # No apt/system-deps step: Windows runners ship the MSVC toolchain and WebView2
  # SDK, and libgit2-sys builds its vendored copy with `cc`, same as on Linux.
  rust-windows:
    name: Rust (Windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # See the Linux job: tauri.windows.conf.json bundles
      # resources/pdfium/pdfium.dll (#37), which tauri-build checks at compile
      # time. Node + tar ship on windows-latest; working-directory is src-tauri.
      - name: Fetch PDFium native library
        run: node ../scripts/fetch-pdfium.mjs

      - name: Build
        run: cargo build --locked

      - name: Compile library unit tests (no-run; see job comment)
        run: cargo test --locked --lib --no-run

      - name: Build examples
        run: cargo build --examples --locked

  # Type-checks/builds/tests the Svelte 5 frontend.
  # Independent of the `rust` job above so the two run in parallel.
  frontend:
    name: Frontend (check + build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must run before actions/setup-node's `cache: pnpm`, which shells out to
      # `pnpm store path` to locate what to cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

  # Runs the Playwright suite in e2e/, which has existed (and been CI-aware —
  # see playwright.config.ts's own `process.env.CI` branches for retries,
  # forbidOnly and reuseExistingServer) without anything ever running it.
  #
  # Its own job rather than more steps on `frontend` above, for two reasons: it
  # needs a browser download that the type-check/unit-test path has no use for,
  # so a flake there would otherwise hold up results those steps already
  # produced; and this way the two run in parallel like `rust` and `frontend`
  # already do.
  #
  # This covers the real Svelte frontend in a real browser with the IPC boundary
  # mocked (e2e/fixtures/tauriMock.ts), NOT the packaged Tauri app — Playwright
  # can't drive Tauri's native webview. See that file's header for the scope
  # this does and doesn't reach.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version` input — package.json's `packageManager` field is the one
      # declaration now (same as the frontend job above since #15; specifying
      # both makes pnpm/action-setup fail with "Multiple versions of pnpm
      # specified").
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile because that is what pins @playwright/test, and a
      # browser build only works with the driver it shipped for. A miss just
      # re-downloads.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium only — playwright.config.ts declares exactly one project. The
      # system libraries from --with-deps are NOT part of the cached path above,
      # so this step still has to run on a cache hit; with the browser already
      # present it just installs those.
      - name: Install Playwright browser + system deps
        run: pnpm exec playwright install --with-deps chromium

      # The fixtures shell out to a real `git` (see e2e/fixtures/tempRepo.ts) and
      # set identity per repo, so the runner needs no global git config.
      - name: Test (playwright)
        run: pnpm test:e2e

      # Only on failure: the HTML report is the whole point of a red e2e run, and
      # traces (trace: "on-first-retry") only exist when something retried.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
