[package]
name = "gitcat"
version = "1.1.0"
description = "A cozy, safety-first desktop Git client."
authors = ["Jiucheng Zang <git.jiucheng@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The daily nightly channel builds with `--features nightly`. Its ONLY effect is
# the max-verbosity Trace logging arm in lib.rs (see that block) — the command
# set, and therefore src/ipc/bindings.ts, is byte-identical with or without it,
# so nightly and stable stay behaviorally the same app apart from log detail.
nightly = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Dev-only structured logging (graph loads, reload decisions, watcher triggers)
# to stdout + the app log dir — see the debug-assertions block in lib.rs and
# src/devlog.ts. `log` provides the LevelFilter the plugin's Builder takes.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", default-features = false }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9"
base64 = "0.22"
# PDF page rasterization for the image/PDF diff preview (issue #37). pdf.js is
# unusable in the WKWebView (its worker hangs; on the main thread it freezes
# the UI), so PDFs are rendered to a PNG in the BACKEND (off the UI thread via
# run_blocking) and shown through the same image path. `pdfium-render` binds to
# a bundled PDFium native lib at runtime (resources/pdfium/, see preview.rs).
pdfium-render = { version = "0.8", features = ["image", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Embedded Luau VM for the plugin scripting runtime (PER-56): sandboxed,
# in-process, curated host API — no shell, no io/os. The `luau` feature builds
# Luau (C++) from vendored source (a C++ toolchain is already required for
# git2's vendored libgit2). Chosen over Lua/WASM/JS: Luau is purpose-built for
# sandboxing untrusted scripts (Roblox) and mlua exposes Lua::sandbox().
mlua = { version = "0.12", features = ["luau"] }
# Multi-window: a repo path handed to a newly spawned window travels as a
# `?repo=` URL query param (see windows.rs's own doc comment) — a repo path
# can contain spaces/#/&/non-ASCII, all meaningful in a URL if not escaped.
# Already resolved transitively (pulled in by tauri/wry's own URL handling —
# see Cargo.lock), so this promotes an already-locked version to a direct
# dependency rather than adding a new one to the tree.
percent-encoding = "2"
# SSH askpass helper (see askpass.rs's own module doc): a synchronous,
# no-event-loop-needed native message box, shown from a throwaway re-exec of
# this SAME binary (see windows.rs's own current_exe() precedent) when ssh
# needs interactive host-key confirmation and has no terminal to ask on.
# Already in the tree via tauri-plugin-dialog's own file-picker backend, so
# this promotes an already-locked version to a direct dependency.
#
# `default-features = false` is REQUIRED, not cosmetic: rfd's default features
# select its `xdg-portal` Linux backend, but tauri-plugin-dialog already
# selects the `gtk3` backend — and rfd's build.rs hard-panics if both are on
# at once ("You can't enable both `gtk3` and `xdg-portal` features at once").
# Feature unification is additive, so leaving rfd's defaults on turns BOTH
# backends on for the single shared rfd crate and breaks the Linux build. We
# only use the synchronous MessageDialog, which is backend-agnostic, so mirror
# the gtk3 backend the rest of the app (and its GTK/WebKit runtime) links.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

# Dev-only profiling/inspection (see run()'s own doc comment in lib.rs for
# the full rationale) — compiled in unconditionally like any other
# dependency, but only ever INITIALIZED behind #[cfg(debug_assertions)], so
# neither opens its diagnostic port nor adds tracing overhead in a release
# build. `tokio`'s "tracing" feature is what actually lets console-subscriber
# see task events at all — tauri's own async_runtime already runs on a real
# tokio::runtime::Runtime, so this unifies with (not duplicates) that.
tauri-plugin-devtools = "2.1.0"
console-subscriber = "0.5"
tokio = { version = "1", features = ["tracing"] }

# A separate profile for local flamegraph profiling (samply, WPA, etc. —
# see run()'s own doc comment in lib.rs for the profiling story this is
# part of), DELIBERATELY NOT added to [profile.release] itself:
# .github/workflows/release.yml's real release pipeline builds a 6-platform
# matrix that all share whatever [profile.release] says, and unlike
# Windows' MSVC toolchain (which always emits debug info as a SEPARATE .pdb
# next to the .exe, at zero cost to the shipped binary), Linux/macOS
# typically embed DWARF debug info directly IN the binary unless a
# platform-specific strip step runs — turning debug info on for every
# platform's real release artifact just to profile locally on one dev's
# Windows machine would have silently bloated 5 platforms' shipped
# installers for a benefit only this one has any use for. `cargo build
# --profile profiling` builds into target/profiling/ instead, fully
# isolated from anything release.yml touches.
[profile.profiling]
inherits = "release"
debug = true

